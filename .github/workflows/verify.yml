name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: forge-v2-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge -d forge_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://forge:forge@127.0.0.1:5432/forge_test
      TEST_DATABASE_URL: postgres://forge:forge@127.0.0.1:5432/forge_test
      NODE_ENV: development
      APP_ENV: development
      ALLOW_DEV_IDENTITY: "true"
      DEV_ACCOUNT_ID: 00000000-0000-4000-8000-000000000001
      DEV_ACCOUNT_ALIAS: athlete-a
      FORGE_GIT_SHA: ${{ github.sha }}
      FORGE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      FORGE_VERSION: 0.1.0-experimental
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with: { node-version: 24.19.0 }
      - run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - run: echo "FORGE_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:secrets
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm test
      - run: pnpm build
      - run: docker build --build-arg FORGE_VERSION="$FORGE_VERSION" --build-arg FORGE_GIT_SHA="$FORGE_GIT_SHA" --build-arg FORGE_BUILD_ID="$FORGE_BUILD_ID" --build-arg FORGE_BUILD_TIMESTAMP="$FORGE_BUILD_TIMESTAMP" -t "forge-v2:$FORGE_GIT_SHA" .
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
