services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - forge_pgdata:/var/lib/postgresql/data
volumes:
  forge_pgdata:
